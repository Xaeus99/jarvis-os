# CI ONLY (install-test workflow): an unattended install into the FREE SPACE of a disk that already holds a
# dummy Windows (ESP + MSR + NTFS C: + NTFS recovery). It proves the installer leaves every Windows
# partition byte-for-byte unchanged. Never used for a real install: the real ISO (iso.toml) is interactive.
#   clearpart --none   -> no existing partition is removed or formatted
#   autopart           -> new partitions only in unallocated space (Anaconda's "free space" mode)
# This first variant runs without Secure Boot, so the Secure Boot key step of iso.toml is left out here.
[customizations.installer.kickstart]
contents = '''
text
lang en_US.UTF-8
keyboard us
timezone America/New_York --utc
network --bootproto=dhcp --activate --hostname=jarvis-os
ignoredisk --only-use=vda
clearpart --none
autopart --type=btrfs --noswap
bootloader --append="console=tty0 console=ttyS0,115200"
user --name=jarvis --password=jarvis-install-test --plaintext --groups=wheel
rootpw --lock
# a text-mode install would otherwise leave the system booting to a text console (multi-user.target)
xconfig --startxonboot
poweroff
%post --log=/var/log/jarvis-install-test-post.log
systemctl set-default graphical.target
# firmware boot entry: "JARVIS OS" instead of the base's name (jarvis-boot-names.service re-checks every boot)
/usr/libexec/jarvis-os/efi-label || :
# test-only: write a diagnostics report on every boot, read back from the disk by the CI host
cat > /etc/jarvis-install-report.sh <<'EOF'
#!/usr/bin/bash
sleep 75
{ echo "=== boot $(date -Is)"; cat /usr/lib/jarvis-os/version; efibootmgr -v; lsblk -o NAME,SIZE,FSTYPE,LABEL,PARTLABEL,MOUNTPOINTS
  cat /proc/cmdline; systemctl --no-pager --failed
  journalctl -b --no-pager -u jarvis-grub-theme -u jarvis-boot-names -u tuned -u tuned-ppd | tail -80
  echo "--- boot entries"; hostname; grep -H '^title' /boot/loader/entries/*.conf
  echo "--- grub.cfg"; grep -n -i -E "theme|windows|menuentry|blscfg|timeout|source" /boot/grub2/grub.cfg
  ls -la /boot/grub2 /boot/grub2/themes 2>&1
  echo "--- /etc/default/grub"; cat /etc/default/grub; rpm-ostree status | head -12
} >> /var/log/jarvis-install-report.txt 2>&1
sleep 300   # after the CI has logged in: what the first login did (Tab link, Windows drive, welcome apps)
{ echo "--- after login $(date -Is)"; systemctl --no-pager --failed
  for u in jarvisd jarvis-link jarvis-hud jarvis-indicator jarvis-first-boot-apps jarvis-first-login-tuning; do
    echo "-- $u"; journalctl -b --no-pager _SYSTEMD_USER_UNIT=$u.service | grep -v -E '^\s+(File|\^|~)' | tail -12
  done
  echo "-- udisks / polkit / welcome app"; journalctl -b --no-pager | grep -i -E "udisks|polkit.*(mount|auth)|portal@autostart" | tail -20
  cat /etc/plasmalogin.conf 2>&1 | head -20
} >> /var/log/jarvis-install-report.txt 2>&1
EOF
chmod +x /etc/jarvis-install-report.sh
cat > /etc/systemd/system/jarvis-install-report.service <<'EOF'
[Unit]
Description=CI install-test report
After=graphical.target
[Service]
Type=oneshot
ExecStart=/usr/bin/bash /etc/jarvis-install-report.sh
[Install]
WantedBy=graphical.target
EOF
systemctl enable jarvis-install-report.service
%end
'''
