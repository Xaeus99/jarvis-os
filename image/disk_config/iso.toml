# bootc-image-builder installer config for the real installer ISO (build-iso workflow).
# Partitioning is left to the person on purpose (dual boot): the installer must NEVER auto-wipe a disk,
# so there is no clearpart/autopart here and `unattended` is never set (it would add "clearpart --all").
# The tutorial walks through "Installation destination > the unallocated space only".
# bootc-image-builder adds the payload itself (ostreecontainer from the ISO) and points the installed
# system at this image's registry tag for updates.
[customizations.installer.kickstart]
contents = '''
network --hostname=jarvis-os
%post --log=/var/log/jarvis-os-install-post.log
# boot to the desktop even if the installer ran in text mode (it would pick a text console otherwise)
systemctl set-default graphical.target
# firmware boot entry: "JARVIS OS" instead of the base's name (jarvis-boot-names.service re-checks every boot)
/usr/libexec/jarvis-os/efi-label || :
# Secure Boot: queue the Universal Blue kernel key for enrollment (same as Bazzite's own installer).
# On the first reboot a blue "MOK management" screen asks for it: Enroll MOK > Continue > password universalblue.
KEY=/etc/pki/akmods/certs/akmods-ublue.der
[ -f "$KEY" ] || KEY=$(find /etc/pki /usr/share -name 'akmods-ublue*.der' 2>/dev/null | head -1)
if [ -n "$KEY" ] && [ -d /sys/firmware/efi/efivars ]; then
  mokutil --timeout -1 || :
  printf 'universalblue\nuniversalblue\n' | mokutil --import "$KEY" || :
fi
%end
'''

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Storage", "org.fedoraproject.Anaconda.Modules.Users"]
