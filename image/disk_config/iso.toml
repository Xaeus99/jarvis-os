for css in /usr/share/anaconda/anaconda-gtk.css; do
  [ -f "$css" ] && printf '\n/* JARVIS OS */\n.logo-sidebar { background-color: #090413; }\nAnacondaSpokeWindow #nav-box { background-color: #160a2c; }\n' >> "$css" && echo "colours $css" >> "$LOG"
