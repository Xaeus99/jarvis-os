# bootc-image-builder installer config. Partitioning is left to the user on purpose (dual boot):
# the installer must NEVER auto-wipe the disk. The tutorial walks through "Install alongside Windows"
# into the free space made by shrinking C: in Windows Disk Management.
[customizations.installer.kickstart]
contents = """
%post
bootc switch --mutate-in-place --transport registry ghcr.io/REPO_OWNER/jarvis-os:stable
%end
"""

[customizations.installer.modules]
enable = ["org.fedoraproject.Anaconda.Modules.Storage"]
disable = ["org.fedoraproject.Anaconda.Modules.Users"]
