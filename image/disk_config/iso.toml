iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAWElEQVR42u3PMQ0AIBAEsIcwMTKg
Ag1owv+EjktaB217nkrWK5yAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA
