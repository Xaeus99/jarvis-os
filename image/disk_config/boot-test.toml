# Disk image for the CI boot test only (a throwaway VM user). Never used for real installs.
[[customizations.user]]
name = "jarvis"
password = "jarvis-boot-test"
groups = ["wheel"]

[[customizations.filesystem]]
mountpoint = "/"
minsize = "40 GiB"

# serial console + the journal on it, so the CI log shows why a service failed (test disk only)
[customizations.kernel]
append = "console=tty0 console=ttyS0,115200 systemd.journald.forward_to_console=1"
