# On the very first boot TuneD is still applying its first profile and doesn't answer tuned-ppd in time
# (seen in the VM boot test: DBus NoReply, then "Failed to start tuned-ppd"). Try again instead of staying
# down until the next boot; the power-profile slider in Plasma depends on it.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10
