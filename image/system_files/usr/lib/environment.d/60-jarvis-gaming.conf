# JARVIS OS gaming defaults for NVIDIA (RTX 20-series and newer). Untested on real hardware yet.
# DLSS / NVIDIA Reflex in Proton games (dxvk-nvapi), per Proton's README.
PROTON_ENABLE_NVAPI=1
# Let Proton update games' DLSS DLLs to the newest version (Proton 9+ NGX updater).
PROTON_ENABLE_NGX_UPDATER=1
# Bigger NVIDIA shader cache (10 GB) and keep it, so games stop re-compiling shaders (NVIDIA driver README).
__GL_SHADER_DISK_CACHE_SIZE=10737418240
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1
