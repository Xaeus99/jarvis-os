# Builds the installer ISO (Anaconda) from the published image with bootc-image-builder.
name: build-iso
on: { workflow_dispatch: { inputs: { tag: { default: "beta" } } } }
permissions: { contents: read, packages: read }
jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@v9
      - name: Build ISO
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os"
          mkdir -p output
          sudo podman pull $IMAGE:${{ inputs.tag }}
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/disk_config/iso.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type anaconda-iso --use-librepo=True \
            $IMAGE:${{ inputs.tag }}
      - uses: actions/upload-artifact@v4
        with: { name: jarvis-os-iso, path: output/bootiso/*.iso }
