# Builds the real (interactive) installer ISO from the published, signed image with bootc-image-builder.
# Runs by hand (workflow_dispatch, tag input) and when this file or the installer config changes.
# Output: the ISO + its SHA-256 as a workflow artifact (kept 90 days); size and checksum in the run summary.
name: build-iso
on:
  workflow_dispatch: { inputs: { tag: { default: "beta" } } }
  push: { branches: [main], paths: [".github/workflows/build-iso.yml", "image/disk_config/iso.toml"] }
permissions: { contents: read, packages: read }
concurrency: { group: build-iso, cancel-in-progress: false }
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@v9
      - name: Build ISO
        run: |
          TAG="${{ inputs.tag || 'beta' }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os"
          mkdir -p output
          sudo podman pull "$IMAGE:$TAG"
          VERSION=$(sudo podman run --rm --entrypoint cat "$IMAGE:$TAG" /usr/lib/jarvis-os/version | sed -n 's/^JARVIS_OS_VERSION=//p')
          DIGEST=$(sudo podman image inspect --format '{{.Digest}}' "$IMAGE:$TAG")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"; echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/disk_config/iso.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type anaconda-iso --rootfs btrfs --use-librepo=True \
            "$IMAGE:$TAG"
          sudo chown -R "$USER" output
      - name: Name, size and checksum
        run: |
          mkdir -p dist
          mv output/bootiso/install.iso "dist/jarvis-os-${VERSION}-x86_64.iso"
          cd dist
          sha256sum "jarvis-os-${VERSION}-x86_64.iso" > "jarvis-os-${VERSION}-x86_64.iso.sha256"
          SIZE=$(stat -c %s "jarvis-os-${VERSION}-x86_64.iso")
          { echo "### JARVIS OS installer ISO"
            echo "- file: jarvis-os-${VERSION}-x86_64.iso"
            echo "- size: $SIZE bytes ($(numfmt --to=iec-i --suffix=B $SIZE))"
            echo "- sha256: $(cut -d' ' -f1 jarvis-os-${VERSION}-x86_64.iso.sha256)"
            echo "- image: ${DIGEST}"
            echo "- untested on real hardware; see docs/INSTALL_DAY.md"; } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ISO_SIZE=$SIZE ISO_SHA256=$(cut -d' ' -f1 *.sha256) IMAGE_DIGEST=${DIGEST}"
      - uses: actions/upload-artifact@v4
        with: { name: "jarvis-os-${{ env.VERSION }}-iso", path: dist/, retention-days: 90, compression-level: 0 }
