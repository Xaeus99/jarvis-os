# Click-through install test: the NORMAL interactive installer ISO (image/disk_config/iso.toml, the one that is
# released) driven by clicks the way a person would, next to a dummy Windows disk, three ways of answering the
# dual-boot safety page in parallel: ENTER, nothing typed (continues by itself), and TOUCH WINDOWS + YES.
# Each: Automatic > Done > Begin Installation, then Windows must be byte-identical (partitions, table entries,
# Windows Boot Manager files), the new system must boot, and the guard's log must say what was chosen.
# The released kickstart is used unchanged: the User Creation screen is filled in by typing (full name, user name,
# administrator, password), and after the first boot the test logs in as that user and checks the login happened.
# The ISO gets the same JARVIS installer look as the released one (tools/release/brand_iso.sh).
name: clickthrough-test
on:
  workflow_dispatch: {}
  push: { branches: [main], paths: [".github/workflows/clickthrough-test.yml", "tools/clickthrough_test.sh", "tools/vmctl.py", "tools/install_test.sh", "tools/release/theme_grub_cfg.py", "image/disk_config/iso.toml", "image/disk_config/release.env", "tools/release/brand_iso.sh", "image/installer/art/**"] }
permissions: { contents: read, packages: read }
jobs:
  click:
    strategy: { fail-fast: false, matrix: { mode: [enter, timeout, unlock] } }
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@v9
      - name: Tools (KVM, QEMU, OVMF, OCR, NTFS, GPT)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf imagemagick socat tesseract-ocr ntfs-3g gdisk dosfstools mtools btrfs-progs parted
          chmod +x tools/*.sh; python3 tools/sync_installer_guard.py --check
      - name: Build the installer ISO (the released kickstart, unchanged)
        run: |
          . image/disk_config/release.env
          CHANNEL="${IMAGE_REF%%@*}"; IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os"
          cp image/disk_config/iso.toml /tmp/clickthrough.toml
          mkdir -p output
          sudo podman pull "$IMAGE:$IMAGE_REF"
          [ "$IMAGE:$IMAGE_REF" = "$IMAGE:$CHANNEL" ] || sudo podman tag "$IMAGE:$IMAGE_REF" "$IMAGE:$CHANNEL"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v /tmp/clickthrough.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type anaconda-iso --rootfs btrfs --use-librepo=True \
            "$IMAGE:$CHANNEL"
          sudo chown -R "$USER" output; ls -la output/bootiso
          bash tools/release/brand_iso.sh output/bootiso/install.iso   # the same JARVIS look the released ISO gets
          sudo podman rmi -a -f >/dev/null 2>&1 || true; df -h / /mnt
      - name: Dummy Windows disk
        run: |
          mkdir -p shots
          if sudo install -d -o "$USER" /mnt/work; then D=/mnt/work/disk.raw; else D=$PWD/disk.raw; fi
          echo "DISK=$D" >> "$GITHUB_ENV"
          tools/install_test.sh prepare "$D"
          tools/install_test.sh fingerprint "$D" shots/fingerprint_before.txt
      - name: Click through the installer (${{ matrix.mode }})
        run: tools/clickthrough_test.sh ${{ matrix.mode }} output/bootiso/install.iso "$DISK" shots
      - name: Windows untouched after install?
        run: |
          tools/install_test.sh fingerprint "$DISK" shots/fingerprint_after_install.txt
          tools/install_test.sh collect "$DISK" shots/after_install   # installed boot settings before the first boot
      - name: First boot of the new system
        run: tools/install_test.sh boot "$DISK" shots boot1
      - name: Second boot, through the boot menu's "safe graphics" entry (when the image has it)
        run: |
          tools/install_test.sh collect "$DISK" shots/after_boot1
          if [ -f shots/after_boot1/boot__custom.cfg ]; then
            tools/install_test.sh bootsafe "$DISK" shots boot2 || { echo "::error::safe graphics boot failed"; touch shots/bootsafe_failed; }
          else echo "no safe graphics entry on the installed disk (image without it): skipped"; fi
      - name: Verdict
        run: |
          tools/install_test.sh fingerprint "$DISK" shots/fingerprint_after_boot.txt
          LOGIN_USER=owner tools/install_test.sh collect "$DISK" shots
          ok=1; M=${{ matrix.mode }}
          for f in after_install after_boot; do
            if diff <(sed -n '1,/^# EFI\/Boot fallback/p' shots/fingerprint_before.txt) <(sed -n '1,/^# EFI\/Boot fallback/p' shots/fingerprint_$f.txt); then
              echo "PASS ($f): Windows partitions (MSR, C:, Recovery), their table entries and Windows Boot Manager files are byte-identical"
            else echo "::error::Windows changed ($f)"; ok=0; fi
          done
          G=$(ls shots/*jarvis-dualboot-guard.log 2>/dev/null | head -1); cat "$G" 2>/dev/null | tail -8
          case $M in
            enter)   want="choice=locked.*how=enter";   nlock=3 ;;
            timeout) want="choice=locked.*how=timeout"; nlock=3 ;;
            unlock)  want="choice=unlocked.*how=typed"; nlock=3 ;;
          esac
          if [ -n "$G" ] && grep -Eq "$want" "$G" && [ "$(grep -c '^locked /dev/' "$G")" -ge $nlock ] \
             && grep -q "verdict: Windows partition entries unchanged" "$G"; then
            echo "PASS (guard, $M): $(grep -Eo 'choice=[a-z]+' "$G") $(grep -Eo 'how=[a-z]+' "$G"), $(grep -c '^locked /dev/' "$G") locked at the start, $(grep -c '^unlocked /dev/' "$G") unlocked, entries unchanged"
          else echo "::error::guard log missing or not as expected for $M (want $want)"; ok=0; fi
          if [ $M = unlock ] && [ "$(grep -c '^unlocked /dev/' "$G")" -lt 3 ]; then echo "::error::TOUCH WINDOWS + YES did not unlock the 3 partitions"; ok=0; fi
          ls shots/boot1_c*desktop*.png >/dev/null 2>&1 && echo "new system booted (desktop screenshots: $(ls shots/boot1_c*desktop*.png | wc -l))"
          # the account typed into User Creation: exists, is an administrator, and was logged into on the first boot
          if grep -q "^user owner exists" shots/login_evidence.txt 2>/dev/null && grep -q "^admin owner yes" shots/login_evidence.txt \
             && grep -q "^logged-in owner yes" shots/login_evidence.txt; then
            echo "PASS (account): $(tr '\n' ';' < shots/login_evidence.txt)"
          else echo "::error::the typed-in account is missing, not an administrator, or was never logged into"; cat shots/login_evidence.txt 2>/dev/null; ok=0; fi
          # installed boot settings: NVIDIA modesetting as a boot setting in every boot entry AND the driver option file
          B=shots/bootcfg_evidence.txt; cat $B
          if grep -Eq '^entries-with-modeset: ([1-9][0-9]*) of \1$' $B && grep -q '^modprobe-file: yes' $B && ! grep -q '^modprobe-file: no' $B; then
            echo "PASS (boot settings): $(grep '^entries-with-modeset' $B), $(grep -m1 '^modprobe-file' $B)"
          else echo "::error::installed boot settings: nvidia-drm.modeset=1 missing from a boot entry, or the driver option file is missing ($(grep -E '^entries-with|^modprobe-file' $B | tr '\n' ';'))"; ok=0; fi
          grep '^entries-with-modeset' shots/after_install/bootcfg_evidence.txt | sed 's/^/info, right after install: /'
          # the "safe graphics" escape hatch (required once the image carries it)
          if grep -q '^safe-graphics-script: yes' $B; then
            L=$(ls shots/*jarvis-safe-graphics.log 2>/dev/null | head -1)
            if grep -q '^custom.cfg-nomodeset: yes' $B && grep -q '^grub.cfg-reads-custom.cfg: yes' $B && [ ! -f shots/bootsafe_failed ] \
               && [ -n "$L" ] && grep -q 'this boot used the safe graphics entry' "$L" && grep -q 'boot cmdline:.*nomodeset.*module_blacklist=nvidia' "$L"; then
              echo "PASS (safe graphics): picked from the boot menu, booted with $(grep -o 'nomodeset module_blacklist=[^ ]*' "$L" | tail -1); $(ls shots/boot2_c*desktop*.png 2>/dev/null | wc -l) desktop screenshots"
            else echo "::error::safe graphics entry missing, not read by GRUB, or its boot did not happen ($(grep -E '^custom|^grub.cfg' $B | tr '\n' ';'))"; cat "$L" 2>/dev/null | tail -5; ok=0; fi
            grep -q '^custom.cfg' shots/after_install/bootcfg_evidence.txt && echo "info: safe graphics entry already there right after install (before the first boot)" || echo "info: safe graphics entry NOT there right after install (written on the first boot)"
          else echo "info: this image has no safe graphics entry"; fi
          echo "### clickthrough-test ($M): $( [ $ok = 1 ] && echo PASS || echo FAIL )" >> "$GITHUB_STEP_SUMMARY"
          cat $B >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat shots/verdict.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "clickthrough-${{ matrix.mode }}", path: shots/ }
