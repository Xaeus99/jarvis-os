# Dual-boot install test: builds an installer ISO from the published image, installs it unattended into the
# free space of a virtual disk that already holds a dummy Windows, then boots the result twice.
# Image: IMAGE_REF in image/disk_config/release.env, the same one the real installer ISO is built from.
# Pass = every Windows partition and Windows boot file has the same sha256 before and after.
name: install-test
on:
  workflow_dispatch: { inputs: { tag: { default: "" } } }
  push: { branches: [main], paths: [".github/workflows/install-test.yml", "image/disk_config/release.env", "tools/install_test.sh", "image/disk_config/install-test.toml", "image/build_files/fix_repos.py"] }
permissions: { contents: read, packages: read }
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
      - uses: ublue-os/remove-unwanted-software@v9
      - name: Tools (KVM, QEMU, OVMF, NTFS, GPT)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf imagemagick socat ntfs-3g gdisk dosfstools mtools btrfs-progs parted
          chmod +x tools/*.sh; df -h /
      - name: Dual-boot guard (the installer's Windows safety page) - local checks on loop devices
        run: |
          python3 tools/sync_installer_guard.py --check
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
          bash tools/test_dualboot_guard.sh
      - name: Build the test installer ISO (bootc-image-builder, unattended free-space kickstart)
        run: |
          . image/disk_config/release.env   # same image as the installer ISO (IMAGE_REF), unless a tag is given by hand
          REF="${{ inputs.tag }}"; REF="${REF:-$IMAGE_REF}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os:$REF"; echo "testing $IMAGE"
          mkdir -p output
          sudo podman pull "$IMAGE"
          # images built before the repo fix still carry a repo with a missing GPG key; apply the same fix here
          printf 'FROM %s\nCOPY fix_repos.py /tmp/fix_repos.py\nRUN ls -l /etc/pki/rpm-gpg | grep -i terra44; cat /etc/yum.repos.d/terra-mesa.repo; grep -n -A4 terra-mesa /etc/dnf/repos.override.d/*.repo; python3 /tmp/fix_repos.py && rm /tmp/fix_repos.py\n' "$IMAGE" > /tmp/Containerfile.iso
          sudo podman build -t localhost/jarvis-os-installtest:latest -f /tmp/Containerfile.iso image/build_files
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/disk_config/install-test.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type anaconda-iso --rootfs btrfs --use-librepo=True \
            localhost/jarvis-os-installtest:latest
          sudo chown -R "$USER" output; ls -la output/bootiso
          sudo podman rmi -a -f >/dev/null 2>&1 || true; df -h /
      - name: Dummy Windows disk
        run: |
          mkdir -p shots
          if sudo install -d -o "$USER" /mnt/work; then D=/mnt/work/disk.raw; else D=$PWD/disk.raw; fi
          echo "DISK=$D" >> "$GITHUB_ENV"
          tools/install_test.sh prepare "$D"
          tools/install_test.sh fingerprint "$D" shots/fingerprint_before.txt
      - name: Install (unattended, free space only)
        run: tools/install_test.sh install "$DISK" output/bootiso/install.iso shots
      - name: Windows untouched after install?
        run: |
          tools/install_test.sh fingerprint "$DISK" shots/fingerprint_after_install.txt
          sudo sgdisk -p "$DISK"
      - name: First boot (theme service runs, report written)
        run: tools/install_test.sh boot "$DISK" shots boot1
      - name: Second boot (themed menu with Windows entry, desktop)
        run: tools/install_test.sh boot "$DISK" shots boot2
      - name: Verdict
        run: |
          tools/install_test.sh fingerprint "$DISK" shots/fingerprint_after_boots.txt
          tools/install_test.sh collect "$DISK" shots
          ok=1
          for f in after_install after_boots; do
            if diff <(sed -n '1,/^# EFI\/Boot fallback/p' shots/fingerprint_before.txt) <(sed -n '1,/^# EFI\/Boot fallback/p' shots/fingerprint_$f.txt); then
              echo "PASS ($f): Windows partitions (MSR, C:, Recovery), their table entries and Windows Boot Manager files are byte-identical"
            else echo "::error::Windows changed ($f)"; ok=0; fi
          done
          # the dual-boot guard ran inside the installer, found the dummy Windows, locked it and saw no change after
          G=$(ls shots/*jarvis-dualboot-guard.log 2>/dev/null | head -1)
          if [ -n "$G" ] && grep -q "choice=locked" "$G" && grep -q "verdict: Windows partition entries unchanged" "$G" \
             && [ "$(grep -c '^locked /dev/' "$G")" -ge 3 ]; then
            echo "PASS (guard): $(grep -c '^locked /dev/' "$G") Windows partitions locked read-only during the install, entries unchanged"
          else echo "::error::dual-boot guard log missing or not as expected"; cat "$G" 2>/dev/null; ok=0; fi
          GS=$(for f in shots/i*_install_*.png; do tesseract "$f" - 2>/dev/null | grep -qi "safety check" && { echo "$f"; break; }; done)
          [ -n "$GS" ] && cp "$GS" shots/dualboot_screen.png && echo "guard page on screen: $GS"
          echo "--- EFI/Boot fallback before/after (informational)"; grep -A3 '^# EFI/Boot' shots/fingerprint_before.txt shots/fingerprint_after_boots.txt
          echo "### install-test: $( [ $ok = 1 ] && echo PASS || echo FAIL )" >> "$GITHUB_STEP_SUMMARY"
          [ $ok = 1 ]
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: install-test, path: shots/ }
