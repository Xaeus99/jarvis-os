# Boots the published image in a KVM virtual machine on the GitHub runner and screenshots it
# (boot menu, login, Plasma desktop). No NVIDIA GPU in the VM, so it runs on the virtual GPU.
name: boot-test
on:
  workflow_dispatch: { inputs: { tag: { default: "beta" } } }
permissions: { contents: read, packages: read }
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@v9
      - name: KVM + QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf imagemagick socat
          ls -l /dev/kvm
      - name: Build a qcow2 disk from the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os:${{ inputs.tag }}"
          mkdir -p output
          sudo podman pull "$IMAGE"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/disk_config/boot-test.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type qcow2 --rootfs btrfs --use-librepo=True "$IMAGE"
          sudo chown -R "$USER" output && ls -la output/qcow2
          sudo podman rmi -a -f >/dev/null 2>&1 || true
      - name: Boot it and take screenshots
        run: bash tools/boot_test.sh output/qcow2/disk.qcow2 shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: boot-test-screens, path: shots/ }
