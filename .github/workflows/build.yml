# Builds the JARVIS OS image on every push to main and nightly, runs the daemon tests first,
# pushes ghcr.io/<owner>/jarvis-os:{beta,<date>} and signs it with cosign. Promotion to :stable is a
# separate manual job after the beta has booted on a test machine.
name: build-jarvis-os
on:
  push: { branches: [main], paths-ignore: ["docs/**", "**/*.md", ".github/workflows/install-test.yml", ".github/workflows/boot-test.yml", ".github/workflows/build-iso.yml", "tools/install_test.sh", "tools/boot_test.sh", "tools/iso_boot_test.sh", "tools/standalone_test.sh", ".github/workflows/standalone-test.yml", ".github/workflows/promote-stable.yml", "tools/release/**", "image/disk_config/**", "image/installer/**", "tools/sync_installer_guard.py", "tools/test_dualboot_guard.sh", "tools/make_installer_art.py", "tools/clickthrough_test.sh", "tools/vmctl.py", ".github/workflows/clickthrough-test.yml", ".github/workflows/rufus-iso-mode-test.yml", "tools/rufus_iso_mode_stick.sh", ".github/workflows/nvidia-boot-check.yml", "tools/nvidia_boot_check.sh", ".github/workflows/update-test.yml", "tools/update_test.sh", ".github/workflows/secureboot-test.yml"] }
  schedule: [{ cron: "15 6 * * *" }]     # daily, after Bazzite's own nightly
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write, actions: read }
concurrency: { group: build-jarvis-os, cancel-in-progress: false }
jobs:
  # The base image is pinned by digest, so a nightly run of a commit that already has a green build makes a byte-for-byte
  # duplicate :beta with a new digest (and a boot test of it). Nightly runs only build when main moved since then.
  gate:
    runs-on: ubuntu-24.04
    outputs: { go: "${{ steps.g.outputs.go }}" }
    steps:
      - id: g
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          go=yes
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?status=success&per_page=10" \
                   --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }})][0].head_sha' || echo "")
            if [ "$last" = "${{ github.sha }}" ]; then go=no; echo "main (${last:0:7}) already has a green build; nightly duplicate skipped" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
  test:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 espeak-ng ffmpeg
      - run: git ls-files -s | awk '$1=="100755"{print $4}' | xargs -r chmod +x; chmod +x image/build_files/*.sh image/system_files/usr/libexec/jarvis-os/* bootdemo/*.sh tools/*.py   # API commits can drop the exec bit
      - run: pip install -r jarvisd/requirements-test.txt && pip install --no-deps openwakeword==0.6.0   # its tflite dependency has no wheels; jarvisd uses the ONNX models
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q jarvisd/tests
  build:
    needs: test
    runs-on: ubuntu-24.04
    environment: release          # holds SIGNING_SECRET (the cosign private key); no approval rule
    steps:
      - uses: actions/checkout@v5
      - name: Free disk (Bazzite NVIDIA base is ~6 GB compressed)
        uses: ublue-os/remove-unwanted-software@v9
      - run: chmod +x image/build_files/*.sh image/system_files/usr/libexec/jarvis-os/*
      - name: Image name (ghcr needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os" >> "$GITHUB_ENV"
      - name: Build
        run: |
          . image/version.env
          VERSION="${JARVIS_OS_RELEASE}.$(date -u +%Y%m%d)"
          cp -r jarvisd image/jarvisd; cp cosign.pub image/cosign.pub
          sudo podman build --build-arg JARVIS_OS_VERSION="$VERSION" --build-arg IMAGE_REPO="$IMAGE" --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" --label org.opencontainers.image.version="$VERSION" -t "$IMAGE:beta" -t "$IMAGE:$VERSION" image
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman push --digestfile digest.txt "$IMAGE:$VERSION"
          sudo podman push "$IMAGE:beta"
          echo "DIGEST=$(cat digest.txt)" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        env: { COSIGN_PRIVATE_KEY: "${{ secrets.SIGNING_SECRET }}", COSIGN_PASSWORD: "" }
        run: |
          head -1 <<< "$COSIGN_PRIVATE_KEY" | grep -q "BEGIN ENCRYPTED SIGSTORE PRIVATE KEY" || { echo "::error::SIGNING_SECRET is missing or not a cosign key"; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" > /dev/null && echo "signature verified"
      - name: Summary
        run: |
          echo "### JARVIS OS $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\` (tags: beta, $VERSION), signed with cosign" >> "$GITHUB_STEP_SUMMARY"
