# Rerun Oct 16 2026 on beta = D13 (1.0.0-rc1: voice update commands through the root helper).
# Oct 22 2026 (1.0.0-rc2): graphics check + setup check verdict; actions on Node 24. (rc3: webcam features removed check.)
# Oct 23 2026 (1.0.0-rc4): runs again on the rc4 image D20 (setup card layout fix).
# Oct 28 2026 (1.0.0-rc5): VR bridge verdict (selftest, 'pair my headset', host -> VM port 8771 through the firewall, unpair closes it).
# Rerun Oct 15 2026 on beta = D12 (D11 + the safe graphics boot entry).
# Standalone JARVIS test: boots the published image in a KVM virtual PC with a virtual sound card (HDA, as in a
# VirtualBox VM), no Tab link and no GPU, lets the first-login offline-brain download run, then talks to JARVIS:
# a built-in command and three questions only the offline brain can answer. Everything JARVIS says aloud is
# recorded from the virtual sound card and transcribed here, so the artifact proves what was really spoken.
# (re-run for D10, the boot-splash image, Oct 13 2026)
name: standalone-test
on:
  workflow_dispatch: { inputs: { tag: { default: "beta" } } }
  push: { branches: [main], paths: [".github/workflows/standalone-test.yml", "tools/standalone_test.sh"] }
permissions: { contents: read, packages: read }
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ublue-os/remove-unwanted-software@v9
      - name: KVM + QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf imagemagick socat ffmpeg
      - name: Build a qcow2 disk from the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os:${{ inputs.tag || 'beta' }}"
          mkdir -p output
          sudo podman pull "$IMAGE"
          sudo podman image inspect --format 'image {{.Digest}}' "$IMAGE"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/disk_config/boot-test.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type qcow2 --rootfs btrfs --use-librepo=True "$IMAGE"
          sudo chown -R "$USER" output && ls -la output/qcow2
          sudo podman rmi -a -f >/dev/null 2>&1 || true
          qemu-img resize output/qcow2/disk.qcow2 +20G   # room for the offline brain (a few GB)
      - name: Boot, download the offline brain, talk to JARVIS
        run: bash tools/standalone_test.sh output/qcow2/disk.qcow2 shots
      - name: What JARVIS said out loud (transcribed from the virtual sound card)
        if: always()
        run: |
          ls -la shots/jarvis_voice.wav || exit 0
          ffprobe -hide_banner shots/jarvis_voice.wav 2>&1 | tail -3
          set -o pipefail
          pip install -q faster-whisper
          # decode with ffmpeg (16 kHz mono) and hand faster-whisper the samples: the runner's PyAV is too old for it
          ffmpeg -loglevel error -y -i shots/jarvis_voice.wav -ac 1 -ar 16000 -f s16le /tmp/voice.raw
          python3 - <<'EOF' | tee shots/voice_transcript.txt
          import numpy as np
          from faster_whisper import WhisperModel
          audio = np.fromfile("/tmp/voice.raw", dtype=np.int16).astype(np.float32) / 32768.0
          m = WhisperModel("base.en", device="cpu", compute_type="int8")
          segs, info = m.transcribe(audio, language="en", vad_filter=True)
          for s in segs:
              print(f"[{s.start:7.1f}s] {s.text.strip()}")
          EOF
          test -s shots/voice_transcript.txt || { echo "::error::nothing JARVIS said was heard on the sound card"; exit 1; }
          { echo "### What JARVIS said (from the VM's sound card)"; echo '```'; cat shots/voice_transcript.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ffmpeg -loglevel error -y -i shots/jarvis_voice.wav -ac 1 -b:a 64k shots/jarvis_voice.mp3 && rm shots/jarvis_voice.wav
      - name: Verdict - graphics check, setup check, webcam removed (rc2/rc3)
        run: |
          # the VM's shell wraps every command's output in terminal escape codes (OSC 3008 markers, bracketed paste):
          # strip them first, or a line like "FACES=none" doesn't start at column 0 (rc3 run 39712340710 failed on that)
          tr -d '\r' < shots/serial.log | perl -pe 's/\e\][^\a\e]*(?:\a|\e\\)//g; s/\e\[[0-9;?]*[A-Za-z]//g' > /tmp/serial.txt
          S=/tmp/serial.txt
          sed -n '/==== GRAPHICS CHECK/,/==== JARVIS LINK STATE/p' "$S" | grep -v '^\[ *[0-9.]*\]' | head -80
          grep -q '^GPURC=0' "$S" || { echo "::error::jarvisctl gpu check did not exit 0 (expected: no NVIDIA card in the VM)"; exit 1; }
          grep -q 'No NVIDIA card in this computer' "$S" || { echo "::error::the graphics check did not report the VM's missing NVIDIA card"; exit 1; }
          grep -q '^SETUPRC=0' "$S" || { echo "::error::jarvisctl setup status failed"; exit 1; }
          ! sed -n '/==== GRAPHICS CHECK/,/==== JARVIS LINK STATE/p' "$S" | grep -q 'Traceback' || { echo "::error::a Python error in the webcam/graphics/setup checks"; exit 1; }
          echo "graphics check + setup check OK"
          grep -q '^FACES=none' "$S" || { echo "::error::a face data folder exists (webcam features were removed)"; exit 1; }
          grep -q '^CAMLOG=0' "$S" || { echo "::error::jarvisd logged camera activity (webcam features were removed)"; exit 1; }
          grep -q "removed" shots/voice_transcript.txt || { echo "::error::'learn my face' was not answered 'That's been removed'"; exit 1; }
          echo "webcam features removed: OK"
      - name: Verdict - VR bridge (rc5)
        run: |
          tr -d '\r' < shots/serial.log | perl -pe 's/\e\][^\a\e]*(?:\a|\e\\)//g; s/\e\[[0-9;?]*[A-Za-z]//g' > /tmp/serial.txt
          S=/tmp/serial.txt
          sed -n '/==== VR BRIDGE/,/==== BUILT-IN COMMAND/p' "$S" | grep -v '^\[ *[0-9.]*\]' | head -60
          cat shots/vr_host_check.txt || true
          grep -q '^VRTEST=0' "$S" && grep -q 'VR SELFTEST PASSED' "$S" || { echo "::error::jarvisctl vr selftest failed (a pretend headset could not pair over the real server)"; exit 1; }
          grep -q 'LAN server: listening on wss://10\.' "$S" || { echo "::error::'pair my headset' did not open the bridge on the VM's home-network address"; exit 1; }
          grep -q 'JARVIS trusts this headset' shots/vr_trust_page.html || { echo "::error::the bridge's trust page did not load from a home-network address through the firewall"; exit 1; }
          grep -q 'IP Address:10\.' shots/vr_host_check.txt || { echo "::error::the bridge's certificate is not for the VM's private address"; exit 1; }
          grep -q '^VRLISTEN_AFTER_UNPAIR=0' "$S" || { echo "::error::port 8771 still listening after 'unpair my headset'"; exit 1; }
          ! sed -n '/==== VR BRIDGE/,/==== BUILT-IN COMMAND/p' "$S" | grep -q 'Traceback' || { echo "::error::a Python error in the VR bridge"; exit 1; }
          grep -qi 'pairing code' shots/voice_transcript.txt || { echo "::error::JARVIS did not say a headset pairing code out loud"; exit 1; }
          echo "VR bridge: OK"
      - uses: actions/upload-artifact@v6
        if: always()
        with: { name: standalone-test, path: shots/ }
# re-run on beta = D11 (sha256:d3afcec051e0..., NVIDIA modesetting), Oct 14
