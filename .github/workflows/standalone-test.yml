# Standalone JARVIS test: boots the published image in a KVM virtual PC with a virtual sound card (HDA, as in a
# VirtualBox VM), no Tab link and no GPU, lets the first-login offline-brain download run, then talks to JARVIS:
# a built-in command and three questions only the offline brain can answer. Everything JARVIS says aloud is
# recorded from the virtual sound card and transcribed here, so the artifact proves what was really spoken.
# (re-run for D10, the boot-splash image, Oct 13 2026)
name: standalone-test
on:
  workflow_dispatch: { inputs: { tag: { default: "beta" } } }
  push: { branches: [main], paths: [".github/workflows/standalone-test.yml", "tools/standalone_test.sh"] }
permissions: { contents: read, packages: read }
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: ublue-os/remove-unwanted-software@v9
      - name: KVM + QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf imagemagick socat ffmpeg
      - name: Build a qcow2 disk from the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jarvis-os:${{ inputs.tag || 'beta' }}"
          mkdir -p output
          sudo podman pull "$IMAGE"
          sudo podman image inspect --format 'image {{.Digest}}' "$IMAGE"
          sudo podman run --rm --privileged --pull=newer --security-opt label=type:unconfined_t \
            -v ./image/disk_config/boot-test.toml:/config.toml:ro -v ./output:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest --type qcow2 --rootfs btrfs --use-librepo=True "$IMAGE"
          sudo chown -R "$USER" output && ls -la output/qcow2
          sudo podman rmi -a -f >/dev/null 2>&1 || true
          qemu-img resize output/qcow2/disk.qcow2 +20G   # room for the offline brain (a few GB)
      - name: Boot, download the offline brain, talk to JARVIS
        run: bash tools/standalone_test.sh output/qcow2/disk.qcow2 shots
      - name: What JARVIS said out loud (transcribed from the virtual sound card)
        if: always()
        run: |
          ls -la shots/jarvis_voice.wav || exit 0
          ffprobe -hide_banner shots/jarvis_voice.wav 2>&1 | tail -3
          set -o pipefail
          pip install -q faster-whisper
          # decode with ffmpeg (16 kHz mono) and hand faster-whisper the samples: the runner's PyAV is too old for it
          ffmpeg -loglevel error -y -i shots/jarvis_voice.wav -ac 1 -ar 16000 -f s16le /tmp/voice.raw
          python3 - <<'EOF' | tee shots/voice_transcript.txt
          import numpy as np
          from faster_whisper import WhisperModel
          audio = np.fromfile("/tmp/voice.raw", dtype=np.int16).astype(np.float32) / 32768.0
          m = WhisperModel("base.en", device="cpu", compute_type="int8")
          segs, info = m.transcribe(audio, language="en", vad_filter=True)
          for s in segs:
              print(f"[{s.start:7.1f}s] {s.text.strip()}")
          EOF
          test -s shots/voice_transcript.txt || { echo "::error::nothing JARVIS said was heard on the sound card"; exit 1; }
          { echo "### What JARVIS said (from the VM's sound card)"; echo '```'; cat shots/voice_transcript.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ffmpeg -loglevel error -y -i shots/jarvis_voice.wav -ac 1 -b:a 64k shots/jarvis_voice.mp3 && rm shots/jarvis_voice.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: standalone-test, path: shots/ }
# re-run on beta = D11 (sha256:d3afcec051e0..., NVIDIA modesetting), Oct 14
