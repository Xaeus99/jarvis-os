# JARVIS OS boot-menu demo (QEMU). The real install uses the same theme via GRUB_THEME
# with entries generated by bootupd/BLS (JARVIS OS) and os-prober (Windows Boot Manager).
insmod all_video
insmod gfxterm
insmod png
insmod font
set gfxmode=1920x1080,1280x800,auto
set gfxpayload=keep
terminal_output gfxterm
set theme_dir=$prefix/themes/jarvis
loadfont $theme_dir/orbitron_36.pf2
loadfont $theme_dir/rajdhani_20.pf2
loadfont $theme_dir/rajdhani_24.pf2
loadfont $theme_dir/rajdhani_28.pf2
set theme=$theme_dir/theme.txt
export theme
set timeout_style=menu
set timeout=10
set default=0

menuentry "JARVIS OS  ·  Vibranium (44.20261006)" {
    echo "Demo ISO: the real JARVIS OS kernel would start here."
    sleep 4
}
menuentry "Windows 11  ·  Windows Boot Manager" {
    echo "Demo ISO: on his PC this chainloads \EFI\Microsoft\Boot\bootmgfw.efi (Windows is never modified)."
    sleep 4
}
menuentry "JARVIS OS  ·  previous version (rollback)" {
    echo "Demo ISO: bootc keeps the previous image as a second boot entry."
    sleep 4
}
menuentry "UEFI firmware settings (BIOS)" {
    fwsetup
}
